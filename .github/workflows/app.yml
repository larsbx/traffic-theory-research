name: Gridlock City app

on:
  pull_request:
    paths: ['app/**', 'bml/model.py', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'bml/model.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Regenerate the Python BML orbits and require them unchanged
        working-directory: .
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. python app/scripts/bml_fixture.py
          git diff --exit-code app/test/fixtures/bml-python.json
      - run: npm ci
      - run: npm test
      - run: npm run build
