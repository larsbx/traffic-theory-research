name: Finite BML acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: finite-bml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python kernel and orbit certificates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record revision and install Python dependencies
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/revision.txt
          python -m pip install -r requirements-dev.txt
      - name: Kernel, classifier, constructions, and labeled witnesses
        run: python -m pytest -q --junitxml=.artifacts/python-tests.xml | tee .artifacts/python-tests.log
      - name: Verify core geometry and independent capture replay
        run: python scripts/check_capture.py --report .artifacts/capture-replay.json | tee .artifacts/capture-replay.log
      - name: Verify exact finite probability bounds and conserved-strip certificates
        run: python scripts/check_probability.py --report .artifacts/probability-replay.json | tee .artifacts/probability-replay.log
      - name: Verify prescribed lane-profile jams and certificate acceptance bounds
        run: python scripts/check_profiles.py --report .artifacts/profiles-replay.json | tee .artifacts/profiles-replay.log
      - name: Verify disjoint-strip capacity and exact marginal probability laws
        run: python scripts/check_capacity.py --report .artifacts/capacity-replay.json | tee .artifacts/capacity-replay.log
      - name: Verify guarded queues against every small exterior and exact cyclic probabilities
        run: python scripts/check_guarded_queue.py --report .artifacts/guarded-queue-replay.json | tee .artifacts/guarded-queue-replay.log
      - name: Verify guarded barriers and fresh initial-law formation bounds
        run: python scripts/check_barriers.py --report .artifacts/barriers-replay.json | tee .artifacts/barriers-replay.log
      - name: Verify maximal cores, recurrent path mass, and population envelopes
        run: python scripts/check_path_core.py --report .artifacts/path-core-replay.json | tee .artifacts/path-core-replay.log
      - name: Verify exact one-round capture preimages on all 4x4 states
        run: python scripts/check_formation.py --report .artifacts/formation-replay.json | tee .artifacts/formation-replay.log
      - name: Verify tagged fixation and exact Palm probability identities
        run: python scripts/check_fixation.py --report .artifacts/fixation-replay.json | tee .artifacts/fixation-replay.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bml-python-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error

  lean:
    name: Lean proofs, axiom audit, and replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record revision and install replay dependencies
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/revision.txt
          python -m pip install -r requirements-dev.txt
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formal/lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Audit all formal declarations and transitive axioms
        working-directory: formal/lean
        run: |
          lake env lean Audit.lean | tee ../../.artifacts/lean-audit.log
          lake env lean G2Audit.lean | tee ../../.artifacts/g2-audit.log
          lake env lean CosetAudit.lean | tee ../../.artifacts/coset-audit.log
          lake env lean FreeFlowAudit.lean | tee ../../.artifacts/freeflow-audit.log
          lake env lean FreeMaxAudit.lean | tee ../../.artifacts/free-max-audit.log
          lake env lean SparseSpeedAudit.lean | tee ../../.artifacts/sparse-speed-audit.log
      - name: Compare both half-steps on every rectangle with at most nine cells
        run: python scripts/check_lean_replay.py --max-cells 9 --report .artifacts/lean-replay.json | tee .artifacts/lean-replay.log
      - name: Check actual Lean G1 constructions at every admissible population
        run: python scripts/check_g1_constructions.py --max-side 12 --report .artifacts/g1-constructions.json --rows .artifacts/g1-constructions.tsv | tee .artifacts/g1-constructions.log
      - name: Replay actual Lean G2 constructions at every sub-full population
        run: python scripts/check_g2_constructions.py --max-side 12 --report .artifacts/g2-constructions.json --rows .artifacts/g2-constructions.tsv | tee .artifacts/g2-constructions.log
      - name: Check actual Lean diagonal orbits and both coset relations
        run: python scripts/check_cosets.py --max-side 12 --report .artifacts/cosets.json --rows .artifacts/cosets.tsv | tee .artifacts/cosets.log
      - name: Check actual Lean free-flow predicates and full phase traces
        run: python scripts/check_freeflow.py --max-cells 9 --report .artifacts/freeflow.json --rows .artifacts/freeflow.tsv | tee .artifacts/freeflow.log
      - name: Check actual Lean free-flow constructions at every attainable population
        run: python scripts/check_free_max.py --max-side 12 --report .artifacts/free-max.json --rows .artifacts/free-max.tsv | tee .artifacts/free-max.log
      - name: Replay CLASSIC sparse-speed deadlines and movement-rule controls
        run: python scripts/check_sparse_speed.py --report .artifacts/sparse-speed.json | tee .artifacts/sparse-speed.log
      - name: Compare gated constructions and tagged wraparound with CLASSIC Python
        run: python scripts/check_gated.py --report .artifacts/gated-replay.json | tee .artifacts/gated-replay.log
      - name: Check certified cutoff bounds against the actual Lean probe
        run: python scripts/check_absorption.py --backend lean --report .artifacts/absorption-lean.json | tee .artifacts/absorption-lean.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bml-lean-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error

  quint:
    name: Quint exhaustive replay and mutation controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Record revision and install pinned tools
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/revision.txt
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts --prefix formal/quint
      - name: Quint tests, both half-steps, internal invariants, and mutations
        run: python formal/quint/check.py --max-cells 6 --report .artifacts/quint-replay.json | tee .artifacts/quint-replay.log
      - name: Check certified cutoff bounds against the actual Quint probe
        run: python scripts/check_absorption.py --backend quint --report .artifacts/absorption-quint.json | tee .artifacts/absorption-quint.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bml-quint-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
