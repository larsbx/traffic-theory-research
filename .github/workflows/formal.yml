name: Formal acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: formal/quint/package-lock.json

      - name: Install the pinned Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst \
            --output "$RUNNER_TEMP/traffic-lean.tar.zst"
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/traffic-lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/traffic-lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"

      - name: Install locked Quint dependencies
        working-directory: formal/quint
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check proofs, models, and cross-language agreement
        run: python3 scripts/check_formal.py

      - name: Preserve source-bound acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: traffic-formal-${{ github.event.pull_request.head.sha || github.sha }}
          path: formal/artifacts/
          if-no-files-found: error
          retention-days: 30
